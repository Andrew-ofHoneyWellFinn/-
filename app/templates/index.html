{% extends 'base.html' %}

{% block title %}マッピン | マッピン{% endblock %}

{% block extra_head %}
<style>
    .welcome { position: relative; display: grid; min-height: calc(100vh - 76px); grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); align-items: center; gap: clamp(28px, 7vw, 100px); width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0; }
    .welcome-copy { position: relative; z-index: 1; }
    .welcome-kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 22px; color: var(--teal); font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
    .welcome-kicker::before { width: 30px; height: 2px; content: ''; background: var(--coral); }
    .welcome-title { max-width: 620px; margin: 0; color: var(--ink); font-size: clamp(42px, 7vw, 78px); line-height: 1.08; letter-spacing: .02em; font-weight: 800; }
    .welcome-title em { color: var(--coral); font-style: normal; }
    .welcome-description { max-width: 550px; margin: 25px 0 34px; color: var(--ink-soft); font-size: 16px; line-height: 2; }
    .welcome-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .welcome-button { display: inline-flex; min-width: 152px; justify-content: center; padding: 13px 20px; border: 1px solid var(--teal); border-radius: 12px; color: var(--teal-deep); font-weight: 800; text-decoration: none; transition: transform .2s, box-shadow .2s, background .2s; }
    .welcome-button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(20,125,115,.17); }
    .welcome-button.primary { border-color: var(--coral); background: var(--coral); color: white; }
    .welcome-button.primary:hover { background: #d96251; }
    .welcome-map { position: relative; min-height: 390px; overflow: hidden; border: 1px solid rgba(20,125,115,.24); border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; background: #dcebe0; box-shadow: var(--shadow); transform: rotate(2deg); }
    .welcome-map::before, .welcome-map::after { position: absolute; content: ''; border: 1px solid rgba(20,125,115,.22); border-radius: 50%; transform: rotate(-15deg); }
    .welcome-map::before { inset: 17% 12% 26% 21%; }
    .welcome-map::after { inset: 31% 24% 13% 8%; }
    .map-route { position: absolute; inset: 10% 23% 12% 18%; border: 2px dashed rgba(239,118,94,.65); border-radius: 53% 47% 45% 55%; transform: rotate(-25deg); }
    .map-pin { position: absolute; display: grid; width: 62px; height: 62px; place-items: center; border: 8px solid rgba(255,255,255,.7); border-radius: 50% 50% 50% 5px; background: var(--coral); box-shadow: 0 10px 18px rgba(111,70,54,.2); color: white; font-size: 23px; transform: rotate(-45deg); }
    .map-pin span { transform: rotate(45deg); }
    .map-pin.one { top: 25%; left: 30%; }
    .map-pin.two { right: 18%; bottom: 22%; width: 47px; height: 47px; background: var(--teal); }
    .map-note { position: absolute; right: 12%; top: 13%; padding: 9px 12px; border-radius: 10px; background: rgba(255,253,247,.9); color: var(--teal-deep); font-size: 12px; font-weight: 800; transform: rotate(4deg); }
    html.dark .welcome-title { color: #edf5ee; }
    html.dark .welcome-description { color: #c7ddd3; }
    html.dark .welcome-map { background: #245451; }
    html.dark .map-note { background: #173b3a; color: #d8f0e2; }
    @media (max-width: 760px) {
        .welcome { display: flex; min-height: calc(100vh - 68px); flex-direction: column; align-items: stretch; justify-content: center; width: calc(100% - 32px); padding: 38px 0; }
        .welcome-title { font-size: clamp(40px, 13vw, 62px); }
        .welcome-description { font-size: 14px; line-height: 1.8; }
        .welcome-map { min-height: 220px; order: -1; border-radius: 30% 70% 45% 55% / 55% 35% 65% 45%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="welcome">
    <div class="welcome-copy">
        <div class="welcome-kicker">find your way</div>
        <h1 class="welcome-title">旅のきっかけを、<em>見つけよう。</em></h1>
        <p class="welcome-description">リアルタイムな地域・景観・道路情報とAI相談で、徒歩・自転車・車、すべての人にぴったりのお出かけ先を提案します。</p>
        <div class="welcome-actions">
            <a href="{% url 'signup' %}" class="welcome-button primary">新規登録</a>
            <a href="{% url 'login' %}" class="welcome-button">ログイン</a>
        </div>
    </div>
    <div class="welcome-map" aria-hidden="true">
        <div class="map-route"></div>
        <div class="map-pin one"><span>•</span></div>
        <div class="map-pin two"><span>•</span></div>
        <div class="map-note">きょうの寄り道</div>
    </div>
</div>
{% endblock %}
