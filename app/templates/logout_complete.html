{% extends 'base.html' %}

{% block title %}ログアウト完了 | マッピン{% endblock %}

{% block extra_head %}
<!-- ▼ 1秒後に一番最初の画面（index）へ自動遷移する設定 ▼ -->
<meta http-equiv="refresh" content="1;url={% url 'index' %}">

<style>
    .auth-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: 50px auto; text-align: center; box-sizing: border-box; }
    /* ログアウトは少し落ち着いたグレー系の色味にしています */
    .auth-title { margin-top: 0; color: #555; font-size: 24px; margin-bottom: 24px; font-weight: bold; }
    .auth-desc { color: #666; line-height: 1.6; margin-bottom: 20px; }
    
    /* くるくる回るアニメーション（色はグレー） */
    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #999;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .btn-auth { display: inline-block; width: 100%; padding: 14px; background-color: #666; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
    .btn-auth:hover { background-color: #444; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">ログアウトしました</h2>
    
    <p class="auth-desc">
        ご利用ありがとうございました。<br>
        まもなく最初の画面へ自動的に移動します。
    </p>
    
    <!-- アニメーション表示 -->
    <div class="loader"></div>
    
    <p style="font-size: 12px; color: #999; margin-bottom: 20px;">
        画面が切り替わらない場合は、下のボタンを押してください。
    </p>
    
    <!-- 最初の画面（index）への手動リンク -->
    <a href="{% url 'index' %}" class="btn-auth">最初の画面へ戻る</a>
</div>
{% endblock %}
