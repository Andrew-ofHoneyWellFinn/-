{% extends 'base.html' %}

{% block title %}メンテナンス中 | 旅ミッケ{% endblock %}

{% block extra_head %}
<style>
    .maintenance-container { width: calc(100% - 32px); max-width: 600px; margin: 80px auto; padding: 52px 32px; text-align: center; background: #fffdf7; border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
    .maintenance-icon { margin-bottom: 18px; font-size: 52px; }
    .maintenance-title { margin: 0 0 16px; color: var(--ink); font-size: 30px; font-weight: 800; }
    .maintenance-message { margin: 0 0 28px; color: #6b7280; line-height: 1.8; }
    .maintenance-logout { display: inline-block; padding: 12px 24px; border-radius: 11px; background: var(--teal); color: white; font-weight: 800; text-decoration: none; }
    .maintenance-logout:hover { background: var(--teal-deep); }
    html.dark .maintenance-container { background: #173b3a; }
    html.dark .maintenance-title { color: #f3f4f6; }
    html.dark .maintenance-message { color: #d1d5db; }
</style>
{% endblock %}

{% block content %}
<div class="maintenance-container">
    <div class="maintenance-icon" aria-hidden="true">🔧</div>
    <h1 class="maintenance-title">メンテナンス中です</h1>
    <p class="maintenance-message">現在、サービスのメンテナンスを行っています。<br>しばらく時間をおいてから、もう一度お試しください。</p>
    <a href="{% url 'logout' %}" class="maintenance-logout">ログアウト</a>
</div>
{% endblock %}
