{% extends 'base.html' %}

{% block title %}メンテナンス中 | 旅ミッケ{% endblock %}

{% block extra_head %}
<style>
    .maintenance-container { max-width: 560px; margin: 80px auto; padding: 48px 32px; text-align: center; background: white; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .maintenance-icon { margin-bottom: 18px; font-size: 52px; }
    .maintenance-title { margin: 0 0 16px; color: #1f2937; font-size: 30px; font-weight: 700; }
    .maintenance-message { margin: 0 0 28px; color: #6b7280; line-height: 1.8; }
    .maintenance-logout { display: inline-block; padding: 12px 24px; border-radius: 4px; background: #2563eb; color: white; font-weight: 700; text-decoration: none; }
    .maintenance-logout:hover { background: #1d4ed8; }
    html.dark .maintenance-container { background: #1f2937; }
    html.dark .maintenance-title { color: #f3f4f6; }
    html.dark .maintenance-message { color: #d1d5db; }
</style>
{% endblock %}

{% block content %}
<div class="maintenance-container">
    <div class="maintenance-icon" aria-hidden="true">🔧</div>
    <h1 class="maintenance-title">メンテナンス中です</h1>
    <p class="maintenance-message">現在、サービスのメンテナンスを行っています。<br>しばらく時間をおいてから、もう一度お試しください。</p>
    <a href="{% url 'logout' %}" class="maintenance-logout">ログアウト</a>
</div>
{% endblock %}
