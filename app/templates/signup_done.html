{% extends 'base.html' %}

{% block title %}登録完了 | マッピン{% endblock %}

{% block extra_head %}
<!-- ▼ 1秒後に自動的にログイン画面（'login'）へ遷移する設定 ▼ -->
<meta http-equiv="refresh" content="1;url={% url 'login' %}">

<style>
    .auth-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: 50px auto; text-align: center; box-sizing: border-box; }
    .auth-title { margin-top: 0; color: #34A853; font-size: 24px; margin-bottom: 24px; font-weight: bold; }
    .auth-desc { color: #666; line-height: 1.6; margin-bottom: 20px; }
    
    /* 読み込み中のくるくる回るアニメーション */
    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #34A853;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .btn-auth { display: inline-block; width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
    .btn-auth:hover { background-color: #1557b0; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">新規登録が完了しました！</h2>
    
    <p class="auth-desc">
        アカウントの作成に成功しました。<br>
        まもなくログイン画面へ自動的に移動します。
    </p>
    
    <!-- アニメーション表示 -->
    <div class="loader"></div>
    
    <p style="font-size: 12px; color: #999; margin-bottom: 20px;">
        画面が切り替わらない場合は、下のボタンを押してください。
    </p>
    
    <a href="{% url 'login' %}" class="btn-auth">ログイン画面へ進む</a>
</div>
{% endblock %}
