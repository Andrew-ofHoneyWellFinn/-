{% extends 'base.html' %}

{% block title %}パスワード変更完了 | 旅ミッケ{% endblock %}

{% block extra_head %}
<style>
    .auth-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: 50px auto; text-align: center; box-sizing: border-box; }
    .auth-title { margin-top: 0; color: #333; font-size: 24px; margin-bottom: 24px; font-weight: bold; }
    .btn-auth { display: inline-block; padding: 12px 24px; background-color: #34A853; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; transition: background 0.2s; }
    .btn-auth:hover { background-color: #2b8b45; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">変更が完了しました</h2>
    <p style="color: #666; line-height: 1.6;">
        パスワードの変更が正常に完了しました。<br>
        新しいパスワードでログインしてください。
    </p>
    <a href="{% url 'login' %}" class="btn-auth">ログイン画面へ</a>
</div>
{% endblock %}
